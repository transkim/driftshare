<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Driftshare</title>
  <link rel="stylesheet" href="home.css">
</head>
<body>
  <header class="top">
    <img src="icon.png" alt="" class="logo">
    <div class="brand">Driftshare</div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tabNearby" class="tab active" data-view="nearbyView">Nearby phones</button>
    <button role="tab" id="tabPc" class="tab" data-view="pcView">My PC</button>
  </nav>

  <!-- Nearby: direct phone-to-phone, no PC -->
  <main id="nearbyView" class="view">
    <section id="peerList">
      <p class="hint" id="nearbyHint">Looking for phones with Driftshare open on this Wi-Fi…</p>
      <ul class="peers" id="peers"></ul>
      <div class="me">
        <span>This phone is visible as</span>
        <button class="link" id="myNameBtn"></button>
      </div>
    </section>

    <section id="chat" hidden>
      <header class="chat-head">
        <button class="back" id="backBtn" aria-label="Back">&#8249;</button>
        <div>
          <div class="peer-name" id="peerName"></div>
          <div class="peer-status" id="peerStatus"></div>
        </div>
      </header>
      <div class="timeline" id="timeline"></div>
      <div class="transfers" id="transfers"></div>
      <form class="composer" id="composer" autocomplete="off">
        <div class="attach-menu" id="attachMenu" hidden>
          <button type="button" id="pickFilesBtn">📄 Files or photos</button>
          <button type="button" id="pickFolderBtn">📁 A whole folder</button>
        </div>
        <button type="button" class="attach" id="attachBtn" aria-label="Send files or a folder">&#43;</button>
        <textarea id="textInput" rows="1" placeholder="Type a message"></textarea>
        <button type="submit" class="send" aria-label="Send">&#10148;</button>
      </form>
    </section>
  </main>

  <!-- My PC: connect to a Driftshare PC -->
  <main id="pcView" class="view" hidden>
    <p class="hint">Open Driftshare on your PC and click "Connect a phone". Type the address and code it shows.</p>
    <form id="pcForm" class="form">
      <label for="addr">PC address</label>
      <input id="addr" inputmode="url" placeholder="192.168.1.20:47820" autocomplete="off" required>
      <label for="code">Pairing code</label>
      <input id="code" maxlength="6" placeholder="ABC123" autocapitalize="characters" autocomplete="off" required>
      <div class="err" id="err"></div>
      <button type="submit" class="primary" id="go">Connect</button>
    </form>
    <div class="recent" id="recent"></div>
  </main>

  <!-- Incoming files: Accept / Decline -->
  <div class="sheet-bg" id="offerSheet" hidden>
    <div class="sheet" role="dialog" aria-labelledby="offerTitle">
      <h2 id="offerTitle"></h2>
      <ul class="offer-files" id="offerFiles"></ul>
      <div class="sheet-actions">
        <button class="ghost" id="declineBtn">Decline</button>
        <button class="primary" id="acceptBtn">Accept</button>
      </div>
    </div>
  </div>

  <!-- Shared from another app: pick where it goes -->
  <div class="sheet-bg" id="shareSheet" hidden>
    <div class="sheet" role="dialog" aria-labelledby="shareTitle">
      <h2 id="shareTitle"></h2>
      <ul class="offer-files" id="shareFiles"></ul>
      <div class="share-label">Send to</div>
      <ul class="targets" id="shareTargets"></ul>
      <p class="hint small" id="shareHint"></p>
      <div class="transfers" id="shareProgress"></div>
      <div class="sheet-actions">
        <button class="ghost" id="shareCancel">Cancel</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="capacitor.js"></script>
  <script src="home.js"></script>
</body>
</html>
